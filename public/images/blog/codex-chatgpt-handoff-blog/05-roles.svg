<svg xmlns="http://www.w3.org/2000/svg" width="1380" height="720" viewBox="0 0 1380 720" role="img">
  <defs>
    <style>
      .title { font: 700 48px 'Microsoft YaHei','Noto Sans CJK SC','PingFang SC',Arial,sans-serif; fill:#0f172a; }
      .subtitle { font: 400 24px 'Microsoft YaHei','Noto Sans CJK SC','PingFang SC',Arial,sans-serif; fill:#475569; }
      .label { font: 600 22px 'Microsoft YaHei','Noto Sans CJK SC','PingFang SC',Arial,sans-serif; fill:#1e293b; }
      .small { font: 400 17px 'Microsoft YaHei','Noto Sans CJK SC','PingFang SC',Arial,sans-serif; fill:#475569; }
      .tiny { font: 400 14px 'Microsoft YaHei','Noto Sans CJK SC','PingFang SC',Arial,sans-serif; fill:#64748b; }
      .box { fill:white; stroke:#cbd5e1; stroke-width:2; rx:24; }
      .accent { fill:#2563eb; }
      .accent2 { fill:#0f766e; }
      .accent3 { fill:#7c3aed; }
      .accent4 { fill:#f97316; }
      .muted { fill:#e2e8f0; }
      .line { stroke:#64748b; stroke-width:3; fill:none; marker-end:url(#arrow); }
      .dash { stroke:#94a3b8; stroke-width:3; fill:none; stroke-dasharray:8 8; marker-end:url(#arrow); }
      .code { font: 500 18px Consolas,'Microsoft YaHei',monospace; fill:#334155; }
    </style>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M2,2 L10,6 L2,10 Z" fill="#64748b"/>
    </marker>
    <linearGradient id="hero" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#eff6ff"/>
      <stop offset="0.55" stop-color="#f8fafc"/>
      <stop offset="1" stop-color="#ecfeff"/>
    </linearGradient>
  </defs>
  <rect width="100%" height="100%" fill="#f8fafc"/>
  
  <text x="70" y="80" class="title">角色分工：技术负责人 vs 执行工程师</text>
  <text x="70" y="120" class="subtitle">不要让两个工具做同一件事，而要让它们形成分工。</text>
  <rect x="110" y="190" width="500" height="430" rx="34" fill="#eff6ff" stroke="#bfdbfe" stroke-width="3"/>
  <text x="250" y="250" class="title" style="font-size:38px">ChatGPT</text>
  <text x="225" y="295" class="subtitle">技术负责人</text>
  <text x="170" y="365" class="label">• 需求拆解</text>
  <text x="170" y="415" class="label">• 架构判断</text>
  <text x="170" y="465" class="label">• diff 审查</text>
  <text x="170" y="515" class="label">• Bug 定位</text>
  <text x="170" y="565" class="label">• 生成下一轮 Prompt</text>
  <rect x="770" y="190" width="500" height="430" rx="34" fill="#f5f3ff" stroke="#c4b5fd" stroke-width="3"/>
  <text x="940" y="250" class="title" style="font-size:38px">Codex</text>
  <text x="925" y="295" class="subtitle">执行工程师</text>
  <text x="830" y="365" class="label">• 阅读项目</text>
  <text x="830" y="415" class="label">• 修改代码</text>
  <text x="830" y="465" class="label">• 运行命令</text>
  <text x="830" y="515" class="label">• 生成 diff</text>
  <text x="830" y="565" class="label">• 更新 HANDOFF.md</text>
  <path d="M620 400 L760 400" class="line"/>
  <text x="650" y="370" class="small">通过仓库文件交接</text>

</svg>