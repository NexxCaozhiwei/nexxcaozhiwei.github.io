<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img">
  <defs>
    <style>
      .title { font: 700 48px 'Microsoft YaHei','Noto Sans CJK SC','PingFang SC',Arial,sans-serif; fill:#0f172a; }
      .subtitle { font: 400 24px 'Microsoft YaHei','Noto Sans CJK SC','PingFang SC',Arial,sans-serif; fill:#475569; }
      .label { font: 600 22px 'Microsoft YaHei','Noto Sans CJK SC','PingFang SC',Arial,sans-serif; fill:#1e293b; }
      .small { font: 400 17px 'Microsoft YaHei','Noto Sans CJK SC','PingFang SC',Arial,sans-serif; fill:#475569; }
      .tiny { font: 400 14px 'Microsoft YaHei','Noto Sans CJK SC','PingFang SC',Arial,sans-serif; fill:#64748b; }
      .box { fill:white; stroke:#cbd5e1; stroke-width:2; rx:24; }
      .accent { fill:#2563eb; }
      .accent2 { fill:#0f766e; }
      .accent3 { fill:#7c3aed; }
      .accent4 { fill:#f97316; }
      .muted { fill:#e2e8f0; }
      .line { stroke:#64748b; stroke-width:3; fill:none; marker-end:url(#arrow); }
      .dash { stroke:#94a3b8; stroke-width:3; fill:none; stroke-dasharray:8 8; marker-end:url(#arrow); }
      .code { font: 500 18px Consolas,'Microsoft YaHei',monospace; fill:#334155; }
    </style>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M2,2 L10,6 L2,10 Z" fill="#64748b"/>
    </marker>
    <linearGradient id="hero" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#eff6ff"/>
      <stop offset="0.55" stop-color="#f8fafc"/>
      <stop offset="1" stop-color="#ecfeff"/>
    </linearGradient>
  </defs>
  <rect width="100%" height="100%" fill="#ffffff"/>
  
  <rect width="1600" height="900" fill="url(#hero)"/>
  <circle cx="1320" cy="160" r="170" fill="#dbeafe" opacity="0.7"/>
  <circle cx="190" cy="720" r="190" fill="#ccfbf1" opacity="0.65"/>
  <rect x="130" y="160" width="1340" height="580" rx="42" fill="white" stroke="#dbe3ef" stroke-width="2" filter="url(#none)"/>
  <text x="190" y="280" class="title">Codex 额度耗尽时</text>
  <text x="190" y="350" class="title">如何让 ChatGPT 无缝承接编程工作流</text>
  <text x="190" y="420" class="subtitle">把上下文从聊天窗口转移到项目仓库：AGENTS.md、HANDOFF.md、Git diff、Issue、测试日志。</text>
  <rect x="190" y="500" width="300" height="96" rx="24" fill="#eff6ff" stroke="#bfdbfe"/>
  <text x="240" y="560" class="label">ChatGPT</text>
  <text x="240" y="590" class="tiny">技术负责人</text>
  <path d="M510 548 C610 500, 700 500, 800 548" class="line"/>
  <rect x="830" y="500" width="300" height="96" rx="24" fill="#f0fdfa" stroke="#99f6e4"/>
  <text x="895" y="560" class="label">项目仓库</text>
  <text x="895" y="590" class="tiny">唯一事实来源</text>
  <path d="M1150 548 C1230 500, 1290 500, 1370 548" class="line"/>
  <rect x="1180" y="610" width="230" height="82" rx="24" fill="#f5f3ff" stroke="#ddd6fe"/>
  <text x="1236" y="660" class="label">Codex</text>
  <text x="1224" y="686" class="tiny">执行工程师</text>

</svg>