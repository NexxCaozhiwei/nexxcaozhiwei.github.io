<svg xmlns="http://www.w3.org/2000/svg" width="1380" height="760" viewBox="0 0 1380 760" role="img">
  <defs>
    <style>
      .title { font: 700 48px 'Microsoft YaHei','Noto Sans CJK SC','PingFang SC',Arial,sans-serif; fill:#0f172a; }
      .subtitle { font: 400 24px 'Microsoft YaHei','Noto Sans CJK SC','PingFang SC',Arial,sans-serif; fill:#475569; }
      .label { font: 600 22px 'Microsoft YaHei','Noto Sans CJK SC','PingFang SC',Arial,sans-serif; fill:#1e293b; }
      .small { font: 400 17px 'Microsoft YaHei','Noto Sans CJK SC','PingFang SC',Arial,sans-serif; fill:#475569; }
      .tiny { font: 400 14px 'Microsoft YaHei','Noto Sans CJK SC','PingFang SC',Arial,sans-serif; fill:#64748b; }
      .box { fill:white; stroke:#cbd5e1; stroke-width:2; rx:24; }
      .accent { fill:#2563eb; }
      .accent2 { fill:#0f766e; }
      .accent3 { fill:#7c3aed; }
      .accent4 { fill:#f97316; }
      .muted { fill:#e2e8f0; }
      .line { stroke:#64748b; stroke-width:3; fill:none; marker-end:url(#arrow); }
      .dash { stroke:#94a3b8; stroke-width:3; fill:none; stroke-dasharray:8 8; marker-end:url(#arrow); }
      .code { font: 500 18px Consolas,'Microsoft YaHei',monospace; fill:#334155; }
    </style>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M2,2 L10,6 L2,10 Z" fill="#64748b"/>
    </marker>
    <linearGradient id="hero" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#eff6ff"/>
      <stop offset="0.55" stop-color="#f8fafc"/>
      <stop offset="1" stop-color="#ecfeff"/>
    </linearGradient>
  </defs>
  <rect width="100%" height="100%" fill="#f8fafc"/>
  
  <text x="70" y="80" class="title">让仓库成为上下文中枢</text>
  <text x="70" y="120" class="subtitle">不要依赖聊天记录，把任务、决策、测试和交接写入项目文件。</text>
  <rect x="510" y="250" width="360" height="170" rx="30" fill="#ecfeff" stroke="#67e8f9" stroke-width="3"/>
  <text x="600" y="330" class="label">项目仓库</text>
  <text x="558" y="370" class="small">唯一事实来源</text>
  <g>
    <rect x="80" y="210" width="260" height="78" class="box"/><text x="135" y="258" class="label">AGENTS.md</text>
    <rect x="80" y="340" width="260" height="78" class="box"/><text x="112" y="388" class="label">PROJECT_CONTEXT.md</text>
    <rect x="80" y="470" width="260" height="78" class="box"/><text x="145" y="518" class="label">TASKS.md</text>
    <rect x="1040" y="210" width="260" height="78" class="box"/><text x="1105" y="258" class="label">HANDOFF.md</text>
    <rect x="1040" y="340" width="260" height="78" class="box"/><text x="1094" y="388" class="label">DECISIONS.md</text>
    <rect x="1040" y="470" width="260" height="78" class="box"/><text x="1100" y="518" class="label">CHANGELOG.md</text>
  </g>
  <path d="M340 249 L510 315" class="line"/><path d="M340 379 L510 335" class="line"/><path d="M340 509 L510 370" class="line"/>
  <path d="M870 315 L1040 249" class="line"/><path d="M870 335 L1040 379" class="line"/><path d="M870 370 L1040 509" class="line"/>
  <rect x="315" y="625" width="750" height="70" rx="22" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="385" y="670" class="label">上下文写进仓库，ChatGPT 与 Codex 才能围绕同一事实协作</text>

</svg>