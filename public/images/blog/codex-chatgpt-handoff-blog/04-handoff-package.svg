<svg xmlns="http://www.w3.org/2000/svg" width="1380" height="720" viewBox="0 0 1380 720" role="img">
  <defs>
    <style>
      .title { font: 700 48px 'Microsoft YaHei','Noto Sans CJK SC','PingFang SC',Arial,sans-serif; fill:#0f172a; }
      .subtitle { font: 400 24px 'Microsoft YaHei','Noto Sans CJK SC','PingFang SC',Arial,sans-serif; fill:#475569; }
      .label { font: 600 22px 'Microsoft YaHei','Noto Sans CJK SC','PingFang SC',Arial,sans-serif; fill:#1e293b; }
      .small { font: 400 17px 'Microsoft YaHei','Noto Sans CJK SC','PingFang SC',Arial,sans-serif; fill:#475569; }
      .tiny { font: 400 14px 'Microsoft YaHei','Noto Sans CJK SC','PingFang SC',Arial,sans-serif; fill:#64748b; }
      .box { fill:white; stroke:#cbd5e1; stroke-width:2; rx:24; }
      .accent { fill:#2563eb; }
      .accent2 { fill:#0f766e; }
      .accent3 { fill:#7c3aed; }
      .accent4 { fill:#f97316; }
      .muted { fill:#e2e8f0; }
      .line { stroke:#64748b; stroke-width:3; fill:none; marker-end:url(#arrow); }
      .dash { stroke:#94a3b8; stroke-width:3; fill:none; stroke-dasharray:8 8; marker-end:url(#arrow); }
      .code { font: 500 18px Consolas,'Microsoft YaHei',monospace; fill:#334155; }
    </style>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M2,2 L10,6 L2,10 Z" fill="#64748b"/>
    </marker>
    <linearGradient id="hero" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#eff6ff"/>
      <stop offset="0.55" stop-color="#f8fafc"/>
      <stop offset="1" stop-color="#ecfeff"/>
    </linearGradient>
  </defs>
  <rect width="100%" height="100%" fill="#f8fafc"/>
  
  <text x="70" y="80" class="title">最小交接包</text>
  <text x="70" y="120" class="subtitle">当 Codex 额度耗尽，把这些材料交给 ChatGPT，通常就能恢复判断链路。</text>
  <circle cx="690" cy="370" r="125" fill="#eff6ff" stroke="#bfdbfe" stroke-width="3"/>
  <text x="615" y="360" class="label">ChatGPT</text><text x="595" y="395" class="small">接手分析入口</text>
  <g>
    <rect x="100" y="195" width="255" height="78" rx="22" fill="white" stroke="#cbd5e1"/><text x="160" y="244" class="label">HANDOFF.md</text>
    <rect x="100" y="465" width="255" height="78" rx="22" fill="white" stroke="#cbd5e1"/><text x="173" y="514" class="label">git diff</text>
    <rect x="500" y="135" width="380" height="78" rx="22" fill="white" stroke="#cbd5e1"/><text x="562" y="184" class="label">PROJECT_CONTEXT.md / TASKS.md</text>
    <rect x="1025" y="195" width="255" height="78" rx="22" fill="white" stroke="#cbd5e1"/><text x="1090" y="244" class="label">报错日志</text>
    <rect x="1025" y="465" width="255" height="78" rx="22" fill="white" stroke="#cbd5e1"/><text x="1090" y="514" class="label">测试结果</text>
    <rect x="500" y="565" width="380" height="78" rx="22" fill="white" stroke="#cbd5e1"/><text x="600" y="614" class="label">相关源码文件</text>
  </g>
  <path d="M355 235 L565 330" class="line"/><path d="M355 505 L565 410" class="line"/><path d="M690 213 L690 245" class="line"/><path d="M1025 235 L815 330" class="line"/><path d="M1025 505 L815 410" class="line"/><path d="M690 565 L690 495" class="line"/>

</svg>