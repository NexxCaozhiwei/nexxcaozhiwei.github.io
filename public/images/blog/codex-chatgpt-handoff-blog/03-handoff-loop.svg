<svg xmlns="http://www.w3.org/2000/svg" width="1380" height="620" viewBox="0 0 1380 620" role="img">
  <defs>
    <style>
      .title { font: 700 48px 'Microsoft YaHei','Noto Sans CJK SC','PingFang SC',Arial,sans-serif; fill:#0f172a; }
      .subtitle { font: 400 24px 'Microsoft YaHei','Noto Sans CJK SC','PingFang SC',Arial,sans-serif; fill:#475569; }
      .label { font: 600 22px 'Microsoft YaHei','Noto Sans CJK SC','PingFang SC',Arial,sans-serif; fill:#1e293b; }
      .small { font: 400 17px 'Microsoft YaHei','Noto Sans CJK SC','PingFang SC',Arial,sans-serif; fill:#475569; }
      .tiny { font: 400 14px 'Microsoft YaHei','Noto Sans CJK SC','PingFang SC',Arial,sans-serif; fill:#64748b; }
      .box { fill:white; stroke:#cbd5e1; stroke-width:2; rx:24; }
      .accent { fill:#2563eb; }
      .accent2 { fill:#0f766e; }
      .accent3 { fill:#7c3aed; }
      .accent4 { fill:#f97316; }
      .muted { fill:#e2e8f0; }
      .line { stroke:#64748b; stroke-width:3; fill:none; marker-end:url(#arrow); }
      .dash { stroke:#94a3b8; stroke-width:3; fill:none; stroke-dasharray:8 8; marker-end:url(#arrow); }
      .code { font: 500 18px Consolas,'Microsoft YaHei',monospace; fill:#334155; }
    </style>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M2,2 L10,6 L2,10 Z" fill="#64748b"/>
    </marker>
    <linearGradient id="hero" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#eff6ff"/>
      <stop offset="0.55" stop-color="#f8fafc"/>
      <stop offset="1" stop-color="#ecfeff"/>
    </linearGradient>
  </defs>
  <rect width="100%" height="100%" fill="#f8fafc"/>
  
  <text x="70" y="80" class="title">Codex 中断后的接力闭环</text>
  <text x="70" y="120" class="subtitle">额度耗尽不是终点，只要现场被结构化保存，ChatGPT 就能继续分析。</text>
  <rect x="90" y="230" width="210" height="105" rx="24" fill="#f5f3ff" stroke="#c4b5fd"/><text x="156" y="276" class="label">Codex</text><text x="128" y="310" class="small">修改代码 / 跑测试</text>
  <rect x="395" y="230" width="230" height="105" rx="24" fill="#f0fdfa" stroke="#99f6e4"/><text x="453" y="276" class="label">HANDOFF.md</text><text x="438" y="310" class="small">记录现场和阻塞点</text>
  <rect x="720" y="230" width="230" height="105" rx="24" fill="#eff6ff" stroke="#bfdbfe"/><text x="770" y="276" class="label">ChatGPT</text><text x="746" y="310" class="small">审查 diff / 定位问题</text>
  <rect x="1045" y="230" width="230" height="105" rx="24" fill="#fff7ed" stroke="#fed7aa"/><text x="1090" y="276" class="label">恢复 Prompt</text><text x="1080" y="310" class="small">交回 Codex 执行</text>
  <path d="M300 282 L395 282" class="line"/><path d="M625 282 L720 282" class="line"/><path d="M950 282 L1045 282" class="line"/>
  <path d="M1160 335 C1160 500, 200 500, 200 340" class="dash"/>
  <rect x="390" y="430" width="600" height="82" rx="24" fill="white" stroke="#cbd5e1"/>
  <text x="470" y="482" class="label">关键：保存 Git diff、错误日志、测试结果，而不是保存感觉</text>

</svg>